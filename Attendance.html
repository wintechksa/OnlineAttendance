<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wintech Attendance</title>
  <link rel="icon" type="image/x-icon" href="/images/WINTECH.ico">
  <link href='https://fonts.googleapis.com/css?family=EB Garamond' rel='stylesheet'>
</head>

<style>

 iframe {
    height: 850px;
    width: 100%;
  }

.wrapper{
  width: 440px;
  padding: 5px;
}

  .hidelogo {
    position: absolute;
    width: 1500px;
    height: 27px;
    margin: auto;
    background: #fff;
    bottom: 0;
    z-index: 999;
    display: block;
  }

  .iframeContainer{
    overflow: hidden;
    position: relative;
  }

  /* ── Attendance Proof Upload ── */
  .upload-section {
    width: 440px;
    margin: 18px auto 0;
    font-family: 'EB Garamond', serif;
  }

  .upload-section h2 {
    font-size: 17px;
    margin: 0 0 10px;
    color: #173352;
  }

  .upload-notice {
    font-size: 12px;
    color: #555;
    margin-bottom: 10px;
    background: #eef4fb;
    border-left: 3px solid #1A48A2;
    padding: 6px 10px;
    border-radius: 3px;
  }

  #proof-form {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  #proof-form label {
    font-size: 13px;
    color: #333;
  }

  #proof-file {
    border: 1px solid #ccc;
    border-radius: 4px;
    padding: 4px;
    font-size: 13px;
  }

  #proof-form button {
    padding: 8px 14px;
    background: linear-gradient(to right, #1A48A2, #1DB3E8);
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.3s;
  }

  #proof-form button:hover {
    background: linear-gradient(to right, #1DB3E8, #1A48A2);
  }

  #upload-status {
    margin-top: 10px;
    font-size: 13px;
    padding: 8px 12px;
    border-radius: 4px;
    display: none;
  }

  #upload-status.success {
    background: #e6f9ed;
    border: 1px solid #34c25a;
    color: #1a7a35;
  }

  #upload-status.error {
    background: #fdecea;
    border: 1px solid #e53935;
    color: #b71c1c;
  }

  #metadata-display {
    margin-top: 10px;
    font-size: 12px;
    color: #444;
    background: #f5f5f5;
    border: 1px solid #ddd;
    border-radius: 4px;
    padding: 8px 12px;
    display: none;
    word-break: break-all;
  }

  #metadata-display dt {
    font-weight: bold;
    margin-top: 4px;
  }

  #metadata-display dd {
    margin: 0 0 2px 10px;
  }
</style>

<body>
<center>
<div class="wrapper">
    <div class="iframeContainer">
      <iframe frameborder="0" scrolling="yes"
              src="https://1drv.ms/x/c/85b471aee3566fcc/IQQ3Bw-50vVRQpGN5ubQ5wl7AWyVT8ATFuCcO7NHcYHwG4k?em=2&wdAllowInteractivity=False&AllowTyping=True&ActiveCell='WINTECH'!C11&Item=Wintech&wdHideGridlines=True&wdInConfigurator=True&wdInConfigurator=True">
      </iframe>
      <div class="hidelogo"></div>
  </div>

  <!-- ── Privacy-first attendance proof upload ── -->
  <section class="upload-section" aria-label="Attendance Proof Upload">
    <h2>Attendance Proof (optional)</h2>
    <p class="upload-notice">
      &#x1F512; Privacy notice: uploaded files are <strong>never stored</strong>.
      Only a SHA-256 fingerprint and basic file metadata are recorded locally in your browser.
    </p>
    <form id="proof-form" novalidate>
      <label for="proof-file">Select proof image or document</label>
      <input id="proof-file" type="file" accept="image/*,.pdf,.doc,.docx" />
      <button type="submit">Submit Proof</button>
    </form>
    <div id="upload-status" role="alert"></div>
    <dl id="metadata-display"></dl>
  </section>
</div>
</center>

<script>
  // ── Configuration ──────────────────────────────────────────────────────────
  // STORE_UPLOADS=false  → files are never written to disk or sent to a server.
  // Only metadata (hash, name, type, size, timestamp) is kept in localStorage.
  var CONFIG = {
    STORE_UPLOADS: false,
    MAX_FILE_SIZE_MB: 10,
    ALLOWED_MIME_PREFIXES: ['image/', 'application/pdf',
                            'application/msword',
                            'application/vnd.openxmlformats-officedocument']
  };

  // ── Helpers ─────────────────────────────────────────────────────────────────
  function showStatus(message, type) {
    var el = document.getElementById('upload-status');
    el.textContent = message;
    el.className = type;
    el.style.display = 'block';
  }

  function showMetadata(meta) {
    var dl = document.getElementById('metadata-display');
    dl.innerHTML =
      '<dt>File name</dt><dd>' + escapeHtml(meta.fileName) + '</dd>' +
      '<dt>MIME type</dt><dd>' + escapeHtml(meta.mimeType) + '</dd>' +
      '<dt>Size</dt><dd>' + (meta.size / 1024).toFixed(1) + ' KB</dd>' +
      '<dt>SHA-256</dt><dd>' + escapeHtml(meta.sha256) + '</dd>' +
      '<dt>Recorded at</dt><dd>' + escapeHtml(meta.timestamp) + '</dd>';
    dl.style.display = 'block';
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function validateFile(file) {
    var maxBytes = CONFIG.MAX_FILE_SIZE_MB * 1024 * 1024;
    if (file.size > maxBytes) {
      return 'File is too large (max ' + CONFIG.MAX_FILE_SIZE_MB + ' MB).';
    }
    if (!file.type) {
      return 'Could not determine the file type. Please upload an image or PDF/Word document.';
    }
    var allowed = CONFIG.ALLOWED_MIME_PREFIXES.some(function (prefix) {
      return file.type.startsWith(prefix);
    });
    if (!allowed) {
      return 'File type not allowed. Please upload an image or PDF/Word document.';
    }
    return null;
  }

  // Compute SHA-256 of an ArrayBuffer using the Web Crypto API
  function sha256Hex(buffer) {
    return crypto.subtle.digest('SHA-256', buffer).then(function (hashBuffer) {
      var bytes = Array.from(new Uint8Array(hashBuffer));
      return bytes.map(function (b) {
        return b.toString(16).padStart(2, '0');
      }).join('');
    });
  }

  // ── Form handler ────────────────────────────────────────────────────────────
  document.getElementById('proof-form').addEventListener('submit', function (e) {
    e.preventDefault();

    var fileInput = document.getElementById('proof-file');
    var file = fileInput.files && fileInput.files[0];

    if (!file) {
      showStatus('Please select a file before submitting.', 'error');
      return;
    }

    var validationError = validateFile(file);
    if (validationError) {
      showStatus(validationError, 'error');
      return;
    }

    // Read file bytes into memory only — never write to disk or send to server
    var reader = new FileReader();
    reader.onload = function (evt) {
      var arrayBuffer = evt.target.result;

      sha256Hex(arrayBuffer).then(function (hash) {
        var meta = {
          fileName: file.name,
          mimeType: file.type,
          size: file.size,
          sha256: hash,
          timestamp: new Date().toISOString()
        };

        if (!CONFIG.STORE_UPLOADS) {
          // Drop our reference to the buffer so the GC can reclaim it;
          // actual deallocation timing depends on the JS engine.
          arrayBuffer = null;

          // Persist metadata in localStorage for audit purposes
          try {
            var records = JSON.parse(localStorage.getItem('attendance_proofs') || '[]');
            records.push(meta);
            localStorage.setItem('attendance_proofs', JSON.stringify(records));
          } catch (storageErr) {
            // localStorage unavailable — metadata is kept only in memory for this session
            console.warn('localStorage unavailable:', storageErr);
          }
        }

        showStatus('Proof recorded. The file was not stored — only its fingerprint was saved.', 'success');
        showMetadata(meta);

        // Reset the file input so the raw bytes are released from memory
        fileInput.value = '';
      }).catch(function (err) {
        console.error('SHA-256 computation failed:', err);
        showStatus('Could not process the file. Please try again.', 'error');
      });
    };

    reader.onerror = function () {
      showStatus('Failed to read the file. Please try again.', 'error');
    };

    // Read into memory — triggers onload above
    reader.readAsArrayBuffer(file);
  });
</script>
</body>

</html>
